version: 1
repowiki:
  notes:
    - text: "VPR application version is 14.2 (VPR_VERSION in config.php) while the exported data schema_version is 12. Do not treat the app version and the schema version as the same sequence."
    - text: "Documentation/README_V2..V14_2 release notes are the authoritative changelog. When an old note conflicts with current code, the code wins."
    - text: "Live search prices are stored in the settings table (price_USD, price_ZIG); the config.php fee constants are only fallback defaults. A price of 0.00 means free and the flow bypasses Paynow entirely."
    - text: "Only the server-side Paynow USD flow (paynow_create.php, paynow_result.php, paynow_status.php plus finalize_vpr_search_from_payment in db.php) may release a certificate. Popup closure, return-to-site, or the generic VPR_USD_PAYMENT_LINK must never be treated as payment proof."
    - text: "ZiG payments open a static Paynow payment link (VPR_ZIG_PAYNOW_LINK) and cannot auto-release certificates; zig_api_charge.php is an intentionally disabled placeholder until the provider API exists."
    - text: "config.php is gitignored and contains live secrets (admin password, Paynow integration key, hashing keys). Never reproduce its values in generated pages."
    - text: "The bundled data/vpr.sqlite predates V12.9 (it has a leftover 'finalizing' column and lacks the settings/admin tables); the first request self-heals it via ensure_v6_schema in db.php. Document the intended schema, not the stale bundled file."
  documents:
    - title: "Architecture Overview"
      goal: "How the flat page-per-function PHP 8 app fits together: entry scripts that all require db.php, single SQLite file storage, no framework, no Composer, no build step, dependency-free XLSX/PDF generation."
      parent: ""
    - title: "Public Search and Certificate Flow"
      goal: "index.php, search_process.php, certificate.php: input validation (AAA1111 registration format), free vs paid path selection, interest ranking shown as 'Order of VPR Registration', certificate numbering (VPR-YYYYMMDD-NNNNNN) and access tokens."
      parent: ""
    - title: "Paynow USD Payment Integration"
      goal: "paynow_create.php, paynow_status.php, paynow_result.php, paynow_return.php and the Paynow helpers in db.php: SHA-512 hash signing, polling, signed callback handling, reference and amount verification, atomic search finalization against duplicate callbacks."
      parent: ""
    - title: "ZiG Payment Path"
      goal: "How ZiG pricing works, why the static Paynow link cannot auto-release certificates, and the deliberately disabled zig_api_charge.php placeholder awaiting a real ZiG charge API."
      parent: ""
    - title: "Admin Console"
      goal: "admin2000.php, recover_admin.php, domain_check.php, repair_payment_db.php: hardened login with IP-hash rate limiting, live pricing control, add/clear interests, search history, analytics, payment monitoring, email-based password recovery."
      parent: ""
    - title: "Data Layer and Schema"
      goal: "db.php and data/vpr.sqlite: lazy schema bootstrap and migrations in ensure_v6_schema, WAL and busy-timeout tuning, all tables (vehicles, interests, searches, search_interests, payments, settings, login_attempts, admin_audit, admin_recovery, system_metadata) and their relationships."
      parent: ""
    - title: "Excel Backup and Migration"
      goal: "data_exchange.php: hand-rolled XLSX writer and reader, the 5-sheet backup workbook format (Metadata, Vehicles, Interests, Searches, SearchInterests), merge-on-import semantics keyed by registration number and certificate number."
      parent: ""
    - title: "Traffic Reports"
      goal: "traffic_report.php: day/week/month search statistics and dependency-free XLSX and PDF report generation."
      parent: ""
    - title: "Security Model"
      goal: "Defense in depth: .htaccess rules, security_headers(), CSP allowing only paynow.co.zw form-action, session hardening, CSRF, HMAC-hashed IPs, login throttling, audit log, certificate access tokens, secrets handling."
      parent: ""
    - title: "Deployment and Operations"
      goal: "Hosting requirements, install and upgrade steps from Documentation/ (README.txt, DEPLOY_NEW_DOMAIN_V14.txt), preserving data/vpr.sqlite across upgrades, domain portability via vpr_public_base_url()."
      parent: ""
knowledgecard:
  notes:
    - text: "Module boundaries: one shared core library (db.php); every entry script is a self-contained page. Modules are: core library, public search and certificate, Paynow USD payments, ZiG payments, admin console, Excel backup and migration, traffic reports, legal/static pages."
    - text: "All shared helpers (DB, schema migrations, security, admin auth, Paynow, search finalization) live in db.php. Do not describe a framework-style layered structure; the app is intentionally flat."
    - text: "Never quote secret values from config.php into knowledge cards; reference key names only."
